name: 打包EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'wx_adder_gui.py'
      - '微信自动添加好友.spec'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl customtkinter pyinstaller
          pip install git+https://github.com/cluic/wxauto.git

      - name: 打包EXE
        run: pyinstaller --noconfirm "微信自动添加好友.spec"

      - name: 上传EXE产物
        uses: actions/upload-artifact@v4
        with:
          name: 微信自动添加好友
          path: dist/微信自动添加好友.exe
          if-no-files-found: error

      - name: 上传日志(可选)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/warn-*.txt
            *.log
          if-no-files-found: ignore
